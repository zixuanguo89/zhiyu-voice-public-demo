services:
  - type: web
    name: zhiyu-voice-demo
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: 'off'
    envVars:
      - key: PUBLIC_DEMO
        value: '1'
      - key: PORT
        value: '10000'
      - key: ASR_PROVIDER
        value: dashscope
      - key: TTS_PROVIDER
        value: dashscope
      - key: LLM_PROVIDER
        value: dashscope
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: RECORDS_ADMIN_TOKEN
        sync: false
